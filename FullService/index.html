<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wahlburgers Specialty Shakes — Fruity Pebbles &amp; Kit Kat</title>
<style>
:root{
  --slate:#314D56; --slate-d:#1F343B; --slate-l:#456672;
  --green:#44B549; --green-d:#008252; --lime:#CDF002; --teal:#16B9A9;
  --navy:#314D56; --navy-d:#1F343B; --navy-l:#456672;
  --gold:#C9A24A; --gold-l:#E4CD8E;
  --fp:#E23B7A; --fp2:#F5C518; --fp3:#3AA0E8;
  --kk:#D3122A; --kk2:#5A3A22;
  --red:#D3122A; --blue:#3AA0E8;
  --cream:#F4F1EA; --paper:#FFFFFF;
  --ink:#1E2B34; --muted:#6E7E8A; --line:#DFE3E0;
  --ok:#008252; --bad:#C23A43;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 6px 22px rgba(31,52,59,.12);
  --shadow-lg:0 14px 40px rgba(31,52,59,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--navy-d);
  background-image:radial-gradient(circle at 20% -10%,rgba(46,90,172,.25),transparent 45%),
                   radial-gradient(circle at 95% 0%,rgba(176,48,58,.18),transparent 40%);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  background:var(--cream);box-shadow:0 0 60px rgba(0,0,0,.35);position:relative}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  padding:10px 14px 12px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.tb-row{display:flex;align-items:center;gap:10px}
.wmark{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.wmark img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.welcome-logo{width:66px;height:66px;display:block;margin:0 auto 12px}
.tb-title{font-size:12.5px;font-weight:700;letter-spacing:.04em;line-height:1.15;flex:1 1 auto}
.tb-title span{display:block;font-weight:400;font-size:10px;color:var(--gold-l);letter-spacing:.16em;text-transform:uppercase}
.pts{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);
  border:1px solid rgba(224,193,147,.4);border-radius:999px;padding:4px 10px;font-weight:800;
  font-size:13px;flex:0 0 auto}
.pts b{color:var(--gold-l)}
.star{color:var(--gold-l);font-size:13px}
.progress{height:6px;background:rgba(255,255,255,.15);border-radius:999px;margin-top:10px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--green));
  border-radius:999px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.seclabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-l);
  margin-top:7px;font-weight:700}
/* ---------- stage ---------- */
.stage{flex:1 1 auto;padding:18px 16px 26px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:20px;
  border:1px solid var(--line)}
h1.scr{font-family:var(--serif);font-size:26px;line-height:1.1;margin:0 0 6px;color:var(--navy)}
h2.scr{font-family:var(--serif);font-size:21px;line-height:1.15;margin:0 0 6px;color:var(--navy)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  font-weight:800;margin:0 0 8px}
.lede{font-size:15px;line-height:1.5;color:var(--ink);margin:0 0 14px}
.muted{color:var(--muted)}
.center{text-align:center}
/* ---------- buttons / nav ---------- */
.navbar{position:sticky;bottom:0;z-index:30;background:linear-gradient(0deg,var(--cream) 70%,rgba(243,238,227,0));
  padding:12px 16px 16px;display:flex;gap:10px}
.btn{appearance:none;border:0;border-radius:12px;font-family:var(--sans);font-weight:800;
  font-size:15px;padding:14px 18px;cursor:pointer;transition:transform .1s,box-shadow .2s,background .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green);color:#fff;flex:1;box-shadow:0 4px 0 var(--green-d)}
.btn-primary:active{box-shadow:0 1px 0 var(--green-d)}
.btn-primary:disabled{background:#B6C2BE;box-shadow:0 4px 0 #9AA8A3;color:#fff;opacity:.7;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--navy);border:2px solid var(--line)}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 4px 0 #9C7338}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
/* ---------- hero / welcome ---------- */
.hero-img{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow)}
.heroframe{background:var(--navy);border-radius:16px;padding:10px;box-shadow:var(--shadow-lg)}
.kicker{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:999px;margin-bottom:12px}
.pricepills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.pricepill{flex:1;min-width:130px;background:var(--cream);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;text-align:center}
.pricepill .p{font-family:var(--serif);font-size:22px;color:var(--navy);font-weight:700}
.pricepill .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
/* ---------- info grid (why it matters) ---------- */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.itile{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px}
.itile .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;margin-bottom:8px}
.itile h3{margin:0 0 4px;font-size:14px;color:var(--navy)}
.itile p{margin:0;font-size:12.5px;line-height:1.4;color:var(--ink)}
/* ---------- menu board ---------- */
.menu-grid{display:flex;flex-direction:column;gap:12px}
.menu-item{display:flex;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:12px;cursor:pointer;align-items:center;transition:transform .12s,box-shadow .2s,border-color .2s;
  position:relative;overflow:hidden}
.menu-item:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--gold-l)}
.menu-item .thumb{width:74px;height:96px;flex:0 0 auto;border-radius:10px;background:#fff;
  object-fit:contain;border:1px solid var(--line)}
.menu-item h3{margin:0 0 3px;font-size:16px;color:var(--navy);font-family:var(--serif)}
.menu-item .tag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.menu-item .price{font-weight:800;color:var(--green-d);font-size:14px;margin-top:5px}
.menu-item .seen{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-size:10px;
  font-weight:800;padding:3px 8px;border-radius:999px;opacity:0;transition:opacity .3s}
.menu-item.opened .seen{opacity:1}
.adult-badge{display:inline-block;background:var(--red);color:#fff;font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle;letter-spacing:.05em}
/* ---------- overlay (item detail) ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(20,40,54,.6);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease}
.sheet{background:var(--cream);width:100%;max-width:680px;max-height:92vh;border-radius:22px 22px 0 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 16px;display:flex;
  align-items:center;gap:10px;z-index:2}
.sheet-head h3{margin:0;font-family:var(--serif);font-size:18px;flex:1}
.x{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;width:32px;height:32px;
  border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
.sheet-body{padding:16px}
.detail-photo{width:160px;margin:0 auto 6px;display:block;background:#fff;border-radius:12px;border:1px solid var(--line)}
/* ---------- click to reveal ---------- */
.reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.reveal{background:var(--navy);color:#fff;border-radius:14px;padding:14px;cursor:pointer;min-height:74px;
  position:relative;transition:transform .12s,background .25s;overflow:hidden;border:1px solid transparent}
.reveal:active{transform:scale(.98)}
.reveal .face{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.reveal .face .ic{width:26px;height:26px;border-radius:50%;background:rgba(224,193,147,.25);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.reveal .back{font-size:12.5px;line-height:1.4;margin-top:8px;color:var(--cream);display:none}
.reveal.open{background:var(--paper);color:var(--ink);border-color:var(--gold-l)}
.reveal.open .face{color:var(--navy)}
.reveal.open .face .ic{background:var(--green);color:#fff}
.reveal.open .back{display:block;color:var(--ink)}
.reveal .tap{position:absolute;bottom:8px;right:10px;font-size:10px;color:var(--gold-l);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em}
.reveal.open .tap{display:none}
.reveal.allergen{background:var(--red)}
.reveal.allergen.open{background:#fff;border-color:var(--red)}
/* ---------- drag/tap build ---------- */
.build-wrap{margin-top:6px}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px dashed var(--gold-l);
  border-radius:12px;padding:0;min-height:50px;transition:border-color .2s,background .2s;overflow:hidden}
.slot .num{width:42px;align-self:stretch;flex:0 0 auto;background:var(--cream);display:flex;align-items:center;
  justify-content:center;font-weight:800;color:var(--gold);font-size:15px;border-right:1px dashed var(--gold-l)}
.slot .content{flex:1;padding:13px 12px;font-weight:700;font-size:14px;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--navy-l);cursor:pointer}
.slot.filled .content{color:var(--ink)}
.slot.filled .num{background:var(--navy);color:#fff;border-right-color:var(--navy)}
.slot.dragover{border-color:var(--green);background:#F0FAF0}
.slot.active{border-color:var(--green);background:#F4FBF4}
.slot.active .num{background:var(--green);color:#fff;border-right-color:var(--green)}
.slot.ok{border-color:var(--ok);background:#F0FAF0}.slot.ok .num{background:var(--ok)}
.slot.err{border-color:var(--bad);background:#FCF0F0}.slot.err .num{background:var(--bad)}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:10px}
.chip{background:var(--navy);color:#fff;border-radius:11px;padding:11px 13px;font-weight:700;font-size:13.5px;
  cursor:grab;box-shadow:0 3px 0 rgba(0,0,0,.24);transition:transform .1s,opacity .2s;border:0;touch-action:manipulation;
  display:inline-flex;align-items:center;gap:9px;text-align:left;line-height:1.22}
.chip .cem{font-size:19px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.chip:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.24)}
.chip.used{opacity:0;pointer-events:none;width:0;padding:0;margin:0;border:0;gap:0}
.slot .content .sem{margin-right:7px}
/* real-photo guided build (full-service) */
.pbstage{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.pbimg{width:100%;max-width:300px;height:296px;object-fit:contain;display:block;margin:0 auto}
.pbcap{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px;min-height:1.2em}
.pbdots{display:flex;gap:6px;justify-content:center;margin:13px 0}
.pbdot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .2s}
.pbdot.on{background:var(--green)}
.pbaction{width:100%;border:0;border-radius:14px;color:#fff;padding:14px 15px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .1s,box-shadow .1s}
.pbaction:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.pbae{font-size:30px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.pbatx{flex:1 1 auto;min-width:0}
.pbatx b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.85;font-weight:800}
.pbal{font-size:16px;font-weight:800;line-height:1.2;margin:2px 0}
.pban{font-size:12px;opacity:.93;font-weight:500;line-height:1.32}
.pbgo{font-weight:800;font-size:13px;flex:0 0 auto;opacity:.92}
.pbcheck{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.pbrow{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:600;opacity:.5;transition:opacity .2s,border-color .2s,background .2s}
.pbrow.done{opacity:1;border-color:var(--green);background:#F4FBF4}
.pbrn{width:21px;height:21px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800}
.pbrow.done .pbrn{background:var(--green)}
.pbct{flex:1 1 auto;display:flex;align-items:center;gap:7px;min-width:0}
.pbce{font-size:15px;flex:0 0 auto}
.pbtick{color:var(--green);font-weight:900;opacity:0;flex:0 0 auto}
.pbrow.done .pbtick{opacity:1}
.pbstage{position:relative}
.pbdrop{outline:2px dashed transparent;transition:outline-color .15s,background .15s}
.pbdrop.over{outline-color:var(--green);background:#F4FBF4}
.pbhint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;font-weight:800;color:var(--green);pointer-events:none}
.pbtray{margin:12px 0 4px}
.pbchip{width:100%;border:0;border-radius:14px;color:#fff;padding:13px 15px;display:flex;align-items:center;gap:13px;text-align:left;cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.22);touch-action:manipulation;transition:transform .1s,box-shadow .1s,opacity .15s}
.pbchip:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.pbchip.dragging{opacity:.5}
.pbce2{font-size:30px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.pbai{width:42px;height:42px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:9px;padding:2px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.pbtx2{flex:1 1 auto;min-width:0}
.pbal2{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.85;font-weight:800}
.pbnm{font-size:16px;font-weight:800;line-height:1.2;margin-top:2px}
.pbnote{font-size:12px;color:var(--muted);font-weight:600;margin-top:7px;text-align:center}
@keyframes pbshake{0%,100%{transform:translate(0,0) rotate(0)}15%{transform:translate(-4px,0) rotate(-2deg)}30%{transform:translate(4px,0) rotate(2deg)}45%{transform:translate(-4px,0) rotate(-2deg)}60%{transform:translate(3px,0) rotate(1.5deg)}75%{transform:translate(-2px,0) rotate(-1deg)}}
.pbimg.pbshake{animation:pbshake .42s linear 2}
@keyframes pbpour{0%{transform:translateY(0);opacity:1}45%{transform:translateY(7px);opacity:.35}65%{opacity:0}100%{transform:translateY(0);opacity:1}}
.pbpour{animation:pbpour .82s ease}
@keyframes pbflash{0%{transform:scale(.985);opacity:.55}100%{transform:scale(1);opacity:1}}
.pbflash{animation:pbflash .3s ease}
.pbjar{position:absolute;width:54%;right:5%;top:-4%;transform-origin:58% 88%;pointer-events:none;z-index:4;filter:drop-shadow(0 5px 7px rgba(0,0,0,.28));opacity:0}
.pbjar.go{animation:pbjarpour 1.3s ease forwards}
@keyframes pbjarpour{
 0%{opacity:0;transform:translate(46px,-26px) rotate(8deg)}
 16%{opacity:1;transform:translate(0,0) rotate(8deg)}
 44%{opacity:1;transform:translate(-24%,0) rotate(-48deg)}
 72%{opacity:1;transform:translate(-24%,0) rotate(-48deg)}
 100%{opacity:0;transform:translate(-8%,-6%) rotate(-22deg)}
}
.build-actions{display:flex;gap:8px;margin-top:14px}
/* ---------- hotspot ---------- */
.hs-wrap{position:relative;width:100%;max-width:340px;margin:6px auto 0;border-radius:14px;overflow:hidden;
  background:#fff;border:1px solid var(--line)}
.hs-wrap img{width:100%;display:block}
.spot{position:absolute;border:3px solid rgba(255,255,255,.0);border-radius:50%;cursor:pointer;
  transform:translate(-50%,-50%);transition:all .2s}
.spot .dot{position:absolute;inset:0;border-radius:50%;border:3px solid var(--gold);
  box-shadow:0 0 0 4px rgba(194,145,79,.35);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,145,79,.5)}70%{box-shadow:0 0 0 10px rgba(194,145,79,0)}100%{box-shadow:0 0 0 0 rgba(194,145,79,0)}}
.spot.found .dot{border-color:var(--green);background:rgba(68,181,73,.25);box-shadow:none;animation:none}
.spot.found .lab{display:block}
.spot .lab{display:none;position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);
  background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;white-space:nowrap}
.hs-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.hs-tag{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--paper);
  border:1px solid var(--line);color:var(--muted)}
.hs-tag.got{background:var(--green);color:#fff;border-color:var(--green)}
/* ---------- quiz ---------- */
.qstem{font-size:16px;font-weight:700;color:var(--navy);line-height:1.35;margin:4px 0 14px}
.qimg{width:130px;display:block;margin:0 auto 12px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);
  border-radius:13px;padding:14px 14px;margin-bottom:9px;font-size:14.5px;font-weight:600;color:var(--ink);
  cursor:pointer;transition:border-color .15s,background .15s;line-height:1.35}
.opt:hover{border-color:var(--gold-l)}
.opt.sel-ok{border-color:var(--ok);background:#F0FAF0}
.opt.sel-bad{border-color:var(--bad);background:#FCF0F0}
.opt.reveal-ok{border-color:var(--ok);background:#F0FAF0}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;margin-top:4px;display:none}
.feedback.show{display:block;animation:fade .3s}
.feedback.good{background:#EAF7EA;border:1px solid var(--green);color:#1F5B22}
.feedback.bad{background:#FBEDEE;border:1px solid var(--red);color:#7C2128}
.feedback b{display:block;margin-bottom:2px}
.qcount{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
/* ---------- checklist ---------- */
.check-list{list-style:none;padding:0;margin:6px 0 0}
.check-list li{display:flex;align-items:center;gap:11px;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:600;transition:background .2s}
.check-list .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--gold-l);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:all .2s}
.check-list li.done{background:#F0FAF0}
.check-list li.done .box{background:var(--green);border-color:var(--green)}
.check-list li.done .txt{color:var(--green-d);text-decoration:line-through;text-decoration-color:rgba(47,143,56,.5)}
/* ---------- timeline ---------- */
.tl{position:relative;padding-left:4px}
.tl-item{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:17px;top:30px;bottom:-4px;width:2px;background:var(--line)}
.tl-dot{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:800;line-height:1;text-align:center;z-index:1}
.tl-dot.go{background:var(--red)}.tl-dot.peak{background:var(--gold)}

.timer-ring{font-size:30px;font-weight:800;font-family:var(--serif);color:var(--navy);text-align:center}

.timerbar i{display:block;height:100%;background:var(--green);width:100%;transition:width 1s linear}
.timerbar i.warn{background:var(--red)}

.sim{margin-top:8px}
.sim-prompt{background:var(--navy);color:#fff;border-radius:13px;padding:12px 14px;font-weight:700;font-size:14px;

.sim-prompt .stepno{flex:0 0 auto;background:var(--gold);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;
  padding:4px 9px;white-space:nowrap;letter-spacing:.04em}
.scene-wrap{position:relative;width:100%;max-width:360px;margin:14px auto 0}
.scene-wrap svg{width:100%;display:block;overflow:visible}
.zone-hi{position:absolute;border:2.5px dashed var(--green);border-radius:16px;pointer-events:none;
  opacity:0;transition:opacity .25s;background:rgba(68,181,73,.06)}
.zone-hi.on{opacity:1;animation:zonepulse 1.4s infinite}
@keyframes zonepulse{0%,100%{box-shadow:0 0 0 0 rgba(68,181,73,.35)}50%{box-shadow:0 0 0 9px rgba(68,181,73,0)}}
.sim-tray{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px;min-height:8px}
.ing{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--gold-l);border-radius:13px;
  padding:10px 13px;font-weight:700;font-size:13px;color:var(--navy);cursor:grab;box-shadow:var(--shadow);

.ing:active{transform:scale(.96)}
.ing.used{display:none}
.sim-action{display:flex;justify-content:center;margin-top:16px;min-height:8px}
.btn-blend{background:var(--green);color:#fff;border:0;border-radius:14px;font-weight:800;font-size:16px;
  padding:15px 32px;cursor:pointer;box-shadow:0 5px 0 var(--green-d);letter-spacing:.03em}

.sim-steps i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block;transition:all .3s}

.cert .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}

.nameinput{width:100%;padding:12px;border:2px solid var(--line);border-radius:11px;font-size:16px;

/* ---------- misc ---------- */

.pill{font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--navy);color:#fff;letter-spacing:.03em}
.pill.gold{background:var(--gold)}.pill.red{background:var(--red)}.pill.green{background:var(--green)}.pill.blue{background:var(--blue)}

@media (max-width:420px){

@media print{
  body{background:#fff}.app{box-shadow:none}.topbar,.navbar,.toasts{display:none!important}

function h(tag, attrs, kids){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k==="text") e.textContent=attrs[k];
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  if(kids){ if(!Array.isArray(kids)) kids=[kids];
    kids.forEach(function(c){ if(c==null) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); }); }
  return e;
}

  setTimeout(function(){t.style.transition="opacity .4s,transform .4s";t.style.opacity="0";t.style.transform="translateY(-10px)";
    setTimeout(function(){t.remove();},400);},2200);
}

  ]);

function buildSequencer(card, steps, key, onDone){
  var correct=steps.slice(), N=correct.length;
  var order=new Array(N).fill(null);
  var firstTry=true, done=false;
  var slotsWrap=h("div",{class:"slots"});
  var tray=h("div",{class:"tray"});
  var slotEls=[], chipByCi={};
  function sT(s){return (s&&typeof s==="object")?s.t:s;}
  function sEm(s){return (s&&typeof s==="object")?(s.em||""):"";}
  function sC(s){return (s&&typeof s==="object")?(s.c||"#1F3A4D"):"#1F3A4D";}

  // slots (numbered, in order)
  correct.forEach(function(_,i){
    var slot=h("div",{class:"slot",
      ondragover:function(e){e.preventDefault();},
      ondrop:function(e){e.preventDefault();var ci=parseInt(e.dataTransfer.getData("text/plain"),10);if(!isNaN(ci))tryPlace(ci);}},[
      h("div",{class:"num",text:(i+1)}),
      h("div",{class:"content",text:"…"})
    ]);
    slotEls.push(slot); slotsWrap.appendChild(slot);
  });

  // chips in shuffled order, but tracked by their correct index (identity)
  var idxs=correct.map(function(_,i){return i;});
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp;}
  idxs.forEach(function(ci){
    var st=correct[ci];
    var chip=h("button",{class:"chip","draggable":"true",style:"background:"+sC(st),
      ondragstart:function(e){e.dataTransfer.setData("text/plain",""+ci);e.dataTransfer.effectAllowed="move";},
      onClick:function(){ tryPlace(ci); }},[
        h("span",{class:"cem",text:sEm(st)}),
        h("span",{text:sT(st)})
      ]);
    chipByCi[ci]=chip; tray.appendChild(chip);
  });

  function nextSlot(){ return order.indexOf(null); }
  function refresh(){
    var n=nextSlot();
    slotEls.forEach(function(s,i){
      if(order[i]!=null) return;
      var active=(i===n && !done);
      s.classList.toggle("active", active);
      s.querySelector(".content").textContent = active ? "Tap the next step…" : "…";
    });
  }
  function tryPlace(ci){
    if(done) return;
    var n=nextSlot(); if(n<0) return;
    if(ci===n){
      // correct next step — lock it in and remove the chip
      order[n]=ci;
      slotEls[n].classList.remove("active");
      slotEls[n].classList.add("filled","ok");
      var cont=slotEls[n].querySelector(".content"); cont.textContent="";
      cont.appendChild(h("span",{class:"sem",text:sEm(correct[ci])}));
      cont.appendChild(document.createTextNode(sT(correct[ci])));
      if(chipByCi[ci]) chipByCi[ci].classList.add("used");
      if(nextSlot()<0) complete(); else refresh();
    } else {
      // wrong step for this position — bounce, keep the chip available
      firstTry=false;
      var s=slotEls[n];
      s.classList.add("err");
      setTimeout(function(){ s.classList.remove("err"); refresh(); },480);
      toast("Not yet — that's a later step","\u21A9\uFE0F","");
    }
  }
  function complete(){
    done=true;
    slotEls.forEach(function(s){ s.classList.remove("active"); });
    card.appendChild(h("div",{class:"feedback good show"},[h("b",{},"Perfect build! \uD83C\uDF89"),document.createTextNode(" That's the brand-standard sequence.")]));
    onDone(firstTry);
  }

  card.appendChild(h("div",{class:"build-wrap"},[ slotsWrap,
    h("p",{class:"eyebrow",text:"Steps — tap (or drag) them in order"}), tray ]));
  refresh();
}

/* Pointer-based drag with tap fallback (works on touch + mouse) */
function enableDrag(chip, getRect, onDeliver){
  var dragging=false, moved=false, sx=0, sy=0, clone=null;
  chip.addEventListener("pointerdown",function(e){
    dragging=true; moved=false; sx=e.clientX; sy=e.clientY;
    try{chip.setPointerCapture(e.pointerId);}catch(_){}
    clone=chip.cloneNode(true); clone.className="ing fly"; clone.style.left=(e.clientX-32)+"px";
    clone.style.top=(e.clientY-20)+"px"; clone.style.opacity=".95"; clone.style.transition="none";
    document.body.appendChild(clone); chip.style.opacity=".25";
    e.preventDefault();
  });
  chip.addEventListener("pointermove",function(e){
    if(!dragging) return;
    if(Math.abs(e.clientX-sx)>6||Math.abs(e.clientY-sy)>6) moved=true;
    if(clone){ clone.style.left=(e.clientX-32)+"px"; clone.style.top=(e.clientY-20)+"px"; }
  });
  function end(e){
    if(!dragging) return; dragging=false;
    if(clone){ clone.remove(); clone=null; }
    chip.style.opacity="";
    if(!moved){ onDeliver(true); return; }   // tap = deliver to active target
    var r=getRect(), x=e.clientX, y=e.clientY;

function photoBuild(card, cfg, onComplete){
  var steps=cfg.steps;
  var i=0, busy=false;

  var stage=h("img",{class:"pbimg",src:cfg.start,alt:"Build stage"});
  var hint=h("div",{class:"pbhint"});
  var stageWrap=h("div",{class:"pbstage pbdrop"},[stage,hint]);
  stageWrap.addEventListener("dragover",function(e){e.preventDefault();stageWrap.classList.add("over");});
  stageWrap.addEventListener("dragleave",function(){stageWrap.classList.remove("over");});
  stageWrap.addEventListener("drop",function(e){e.preventDefault();stageWrap.classList.remove("over");
    var ci=parseInt(e.dataTransfer.getData("text/plain"),10); if(ci===i) doStep();});
  var cap=h("div",{class:"pbcap",text:cfg.startCap});
  card.appendChild(stageWrap); card.appendChild(cap);

  var dots=h("div",{class:"pbdots"});
  var dotEls=steps.map(function(){var d=h("span",{class:"pbdot"});dots.appendChild(d);return d;});
  card.appendChild(dots);

  var tray=h("div",{class:"pbtray"}); card.appendChild(tray);

  card.appendChild(h("p",{class:"eyebrow",text:"Build sequence"}));
  var checklist=h("div",{class:"pbcheck"});
  var checkEls=steps.map(function(st,n){
    var row=h("div",{class:"pbrow"},[
      h("span",{class:"pbrn",text:(n+1)}),
      h("span",{class:"pbct"},[h("span",{class:"pbce",text:st.em}),document.createTextNode(st.t)]),
      h("span",{class:"pbtick",text:"✓"})
    ]);
    checklist.appendChild(row); return row;
  });
  card.appendChild(checklist);

  function flash(){ stage.classList.remove("pbflash"); void stage.offsetWidth; stage.classList.add("pbflash"); setTimeout(function(){ stage.classList.remove("pbflash"); }, 340); }
  function setStage(src,capt){ stage.src=src; if(capt!=null) cap.textContent=capt; flash(); }
  function renderChip(){
    tray.textContent="";
    var st=steps[i];
    if(st.pre){ setTimeout(function(){ if(steps[i]===st) setStage(st.pre, st.preCap||"Ready for the next step"); }, 900); }   // let the prior result linger, then the glass appears before the drag
    hint.textContent = (st.target==="blender"?"▸ Drop on the blender":"▸ Drop on the "+cfg.vessel);
    var icon = st.asset ? h("img",{class:"pbai",src:st.asset,alt:""}) : h("span",{class:"pbce2",text:st.em});
    var chip=h("button",{class:"pbchip","draggable":"true",style:"background:"+st.c,
      ondragstart:function(e){e.dataTransfer.setData("text/plain",""+i);e.dataTransfer.effectAllowed="move";chip.classList.add("dragging");},
      ondragend:function(){chip.classList.remove("dragging");},
      onClick:function(){ doStep(); }},[
        icon,
        h("div",{class:"pbtx2"},[
          h("div",{class:"pbal2",text:"Step "+(i+1)+" of "+steps.length}),
          h("div",{class:"pbnm",text:st.t})
        ]),
        h("span",{class:"pbgo",text:"⇧ drag"})
    ]);
    tray.appendChild(chip);
    tray.appendChild(h("div",{class:"pbnote",text:st.note}));
  }
  function doStep(){
    if(busy||i>=steps.length) return;
    var st=steps[i];
    function reveal(){
      setStage(st.img, (i+1)+". "+st.t);
      dotEls[i].classList.add("on"); checkEls[i].classList.add("done");
      i++; busy=false;
      if(i>=steps.length) finish(); else renderChip();
    }
    if(st.fx==="shake"){ busy=true; hint.textContent="Blending…"; stage.classList.remove("pbflash"); stage.classList.add("pbshake");
      setTimeout(function(){ stage.classList.remove("pbshake"); reveal(); }, 950); }
    else if(st.fx==="pour"){ busy=true; hint.textContent="Pouring…";
      var jar=h("img",{class:"pbjar",src:(st.asset||IMG.pour_pitcher),alt:""});
      stageWrap.appendChild(jar); void jar.offsetWidth; jar.classList.add("go");
      setTimeout(function(){ setStage(st.img,(i+1)+". "+st.t); }, 780);     // filled glass appears mid-pour
      setTimeout(function(){ if(jar.parentNode) jar.parentNode.removeChild(jar);
        dotEls[i].classList.add("on"); checkEls[i].classList.add("done"); i++; busy=false;
        if(i>=steps.length) finish(); else renderChip(); }, 1300);
    }
    else { reveal(); }
  }
  function finish(){
    hint.textContent=""; tray.textContent="";
    tray.appendChild(h("div",{class:"feedback good show"},[
      h("b",{},"Brand-standard build! 🎉"),
      document.createTextNode(" Every step matched the spec — build it this way every time and serve it picture-ready.")
    ]));
    onComplete(true);
  }
  renderChip();
}


function shakeBuilder(card, vkey, onComplete){
  var v=VARIANTS[vkey], stages=BSTAGE[vkey], si=0, firstTry=true;
  var wrap=h("div",{class:"sim"});

  var zoneHi=h("div",{class:"zone-hi"}); sceneWrap.appendChild(zoneHi);
  var stepsDots=h("div",{class:"sim-steps"});
  var tray=h("div",{class:"sim-tray"});

  wrap.appendChild(promptBar); wrap.appendChild(sceneWrap); wrap.appendChild(stepsDots);
  wrap.appendChild(tray); wrap.appendChild(actionWrap); card.appendChild(wrap);

  var $$=function(id){return sceneWrap.querySelector("#"+id);};
  var jarFill=$$("jarFill"), jarSpin=$$("jarSpin"), vShake=$$("vShakeFill"), pour=$$("pourStream");
  var jarTop=$$("jarTop"), vTop=$$("vTop");
  var ves=VES[vkey], jarLevel=0;
  function setJar(l){jarLevel=l;var b=182,t=72,y=b-(b-t)*l;jarFill.setAttribute("y",y);jarFill.setAttribute("height",Math.max(0,b-y));
    if(jarTop){jarTop.setAttribute("cy",y);jarTop.style.opacity=l>0.03?"1":"0";}}
  function setVessel(l){var b=ves.fill.bottom,t=ves.fill.y,y=b-(b-t)*l;vShake.setAttribute("y",y);vShake.setAttribute("height",Math.max(0,b-y));
    if(vTop&&ves.men){var m=ves.men,rx=m.rxBot+(m.rxTop-m.rxBot)*l;vTop.setAttribute("cx",m.cx);vTop.setAttribute("cy",y);vTop.setAttribute("rx",rx);vTop.style.opacity=l>0.03?"1":"0";}}
  var scene={
    show:function(id){var el=$$(id); if(el) el.classList.add("show");},
    addToJar:function(frac){ setJar(Math.min(1,jarLevel+frac)); },
    blend:function(done){ jarSpin.classList.add("spinning"); jarFill.setAttribute("fill","url(#shakeG)");
      setTimeout(function(){ jarSpin.classList.remove("spinning"); if(done)done(); },1250); },
    pour:function(done){ pour.style.opacity="1"; var t0=performance.now();
      (function anim(t){var k=Math.min(1,(t-t0)/1100); setJar(1-k); setVessel(k);
        if(k<1) requestAnimationFrame(anim); else { pour.style.opacity="0"; if(done)done(); }})(performance.now()); }
  };

  var ZONES={ blender:[.05,.16,.46,.82], vessel:[.55,.24,.99,.97], rim:[.55,.10,.99,.40] };
  function zoneRect(name){var r=sceneWrap.getBoundingClientRect(),z=ZONES[name];
    return {left:r.left+z[0]*r.width,top:r.top+z[1]*r.height,right:r.left+z[2]*r.width,bottom:r.top+z[3]*r.height};}
  function showZone(name){var z=ZONES[name];
    zoneHi.style.left=(z[0]*100)+"%"; zoneHi.style.top=(z[1]*100)+"%";
    zoneHi.style.width=((z[2]-z[0])*100)+"%"; zoneHi.style.height=((z[3]-z[1])*100)+"%"; zoneHi.classList.add("on");}
  function hideZone(){ zoneHi.classList.remove("on"); }
  var TNAME={blender:"blender",vessel:(vkey==="cup"?"cup":(vkey==="adult"?"mug":"glass")),rim:"rim"};

  function renderStage(){
    var st=stages[si];
    stepsDots.innerHTML="";
    stages.forEach(function(_,i){var d=document.createElement("i"); d.className=(i<si?"done":(i===si?"cur":"")); stepsDots.appendChild(d);});
    promptBar.innerHTML='<span class="stepno">Step '+(si+1)+"/"+stages.length+'</span><span>'+st.prompt+"</span>";
    tray.innerHTML=""; actionWrap.innerHTML=""; hideZone();
    if(st.type==="deliver"){
      showZone(st.target);
      var total=st.items.length, delivered=0;
      st.items.forEach(function(it){
        var chip=h("div",{class:"ing"},[h("span",{class:"em"},it.em),document.createTextNode(it.label)]);
        tray.appendChild(chip);
        enableDrag(chip, function(){return zoneRect(st.target);}, function(success){
          if(!success){ toast("Drop it on the "+TNAME[st.target],"\uD83D\uDC46",""); firstTry=false; return; }
          if(chip.classList.contains("used")) return;
          chip.classList.add("used");
          if(st.target==="blender") scene.addToJar(1/total);
          delivered++;
          if(delivered>=total){ st.apply(scene); afterStage(); }
        });
      });
    } else if(st.type==="press"){
      var b=h("button",{class:"btn-blend go",onClick:function(){ b.disabled=true; b.className="btn-blend";
        scene.blend(function(){ afterStage(); }); }},"\uD83C\uDF00 BLEND");
      actionWrap.appendChild(b);
    } else if(st.type==="pour"){
      var p=h("button",{class:"btn-blend pour go",onClick:function(){ p.disabled=true; p.className="btn-blend pour";
        scene.pour(function(){ afterStage(); }); }},"\uD83E\uDD64 POUR");
      actionWrap.appendChild(p);
    }
  }
  function afterStage(){ si++; if(si>=stages.length) finishBuild(); else setTimeout(renderStage,380); }
  function finishBuild(){
    hideZone();
    promptBar.innerHTML='<span class="stepno">Done</span><span>Beautiful build — just like the photo!</span>';
    tray.innerHTML=""; actionWrap.innerHTML="";
    Array.prototype.forEach.call(stepsDots.querySelectorAll("i"),function(d){d.className="done";});
    wrap.appendChild(h("div",{class:"simdone"},[ h("img",{src:v.img,alt:v.name}),
      h("div",{},"Brand-standard "+v.name+" — ready to serve. \u2713") ]));
    onComplete(firstTry);
  }
  renderStage();
}

    h("p",{class:"lede",text:"One last challenge to prove you're launch-ready. A mix of recipe, build, allergen, and service questions. Score 90% or higher to earn your certificate."}),
    h("div",{class:"igrid"},[
      h("div",{class:"itile"},[h("div",{class:"ic",style:"background:var(--navy)"},"❓"),h("h3",{text:FINAL_POOL.length+" Questions"}),h("p",{text:"Multiple choice, true/false, scenarios & image ID."})]),
      h("div",{class:"itile"},[h("div",{class:"ic",style:"background:var(--green)"},"🎯"),h("h3",{text:"Pass = 90%"}),h("p",{text:"Retry as many times as you need to nail it."})])
    ]),
    h("button",{class:"btn btn-primary",style:"width:100%;margin-top:18px",onClick:function(){runFinal(root,ctx);}},"Start the Challenge")
  ]);
  root.appendChild(card);
}

function runFinal(root,ctx){
  root.innerHTML="";
  var questions=shuffle(FINAL_POOL); // use all
  var qi=0, correct=0;
  var card=h("div",{class:"card"});
  root.appendChild(card);
  function render(){
    card.innerHTML="";
    if(qi>=questions.length){ return showResult(); }
    var q=questions[qi];
    var optsArr=q.type==="tf"?["True","False"]:q.opts;
    card.appendChild(h("div",{class:"qcount",text:"Question "+(qi+1)+" of "+questions.length}));
    var pbar=h("div",{class:"progress",style:"margin-bottom:14px"},[h("div",{class:"bar",style:"width:"+(qi/questions.length*100)+"%"})]);
    card.appendChild(pbar);
    if(q.img) card.appendChild(h("img",{class:"qimg",src:q.img,alt:"item"}));
    card.appendChild(h("p",{class:"qstem",text:q.stem}));
    var fb=h("div",{class:"feedback"}); var answered=false;
    var btns=[];
    optsArr.forEach(function(label,idx){
      var b=h("button",{class:"opt",onClick:function(){
        if(answered)return; answered=true;
        var right=idx===q.a;
        if(right){b.classList.add("sel-ok");correct++;}
        else{ b.classList.add("sel-bad"); btns[q.a].classList.add("reveal-ok"); }
        btns.forEach(function(x){x.disabled=true;});
        fb.className="feedback show "+(right?"good":"bad");
        fb.innerHTML="<b>"+(right?"Correct! ✓":"Not quite.")+"</b>"+q.fb;
        nb.style.display="flex";
      }},label);
      btns.push(b); card.appendChild(b);
    });
    card.appendChild(fb);
    var nb=h("button",{class:"btn btn-primary btn-sm",style:"display:none;margin-top:12px;width:100%",onClick:function(){qi++;render();}},
      qi===questions.length-1?"See My Score":"Next");
    card.appendChild(nb);
  }
  function showResult(){
    var pct=Math.round(correct/questions.length*100);
    var pass=pct>=MASTERY;
    if(pct>S.bestScore) S.bestScore=pct;
    // Report best score to the LMS
    WB_SCORM.recordResult(S.bestScore, MASTERY);
    if(pass && !S.passed){ S.passed=true; awardBadge("certified"); WB_SCORM.setStatus("passed"); }
    addPoints(correct*10,"final answers");
    card.innerHTML="";
    var color=pass?"var(--green-d)":"var(--red)";
    card.appendChild(h("div",{class:"center"},[
      h("p",{class:"eyebrow",text:pass?"Challenge Complete":"Almost There"}),
      h("div",{class:"scoredial",style:"background:conic-gradient("+color+" "+(pct*3.6)+"deg,var(--line) 0)"},[
        h("div",{style:"width:92px;height:92px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:"+color},pct+"%")
      ]),
      h("h1",{class:"scr",text:pass?"You're Specialty Shake Certified! ⭐":"So close!"}),
      h("p",{class:"lede",text:pass
        ? "You got "+correct+" of "+questions.length+" correct. You're ready to build, sell, and serve both Specialty Shakes to brand standard."
        : "You got "+correct+" of "+questions.length+" correct — you need 90% to pass. Review the items you missed and give it another go. You've got this!"})
    ]));
    if(pass){
      card.appendChild(h("button",{class:"btn btn-primary",style:"width:100%;margin-top:6px",onClick:function(){showCertificate(root);}},"🎓 Get My Certificate"));
      card.appendChild(h("button",{class:"btn btn-ghost btn-sm",style:"width:100%;margin-top:10px",onClick:function(){qi=0;correct=0;questions=shuffle(FINAL_POOL);render();}},"Improve My Score"));
    } else {
      card.appendChild(h("button",{class:"btn btn-primary",style:"width:100%;margin-top:6px",onClick:function(){qi=0;correct=0;questions=shuffle(FINAL_POOL);render();}},"Try Again"));
    }
    WB_SCORM.commit();
  }
  render();
}

function showCertificate(root){
  root.innerHTML="";
  var nm=WB_SCORM.getStudentName()||S.name||"";
  var card=h("div",{class:"card"});
  var dateStr=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  function draw(name){
    card.innerHTML="";
    var cert=h("div",{class:"cert"},[
      h("img",{class:"wm",src:IMG.logo,alt:"Wahlburgers"}),
      h("div",{class:"sub",text:"Wahlburgers · Certificate of Completion"}),
      h("div",{class:"ttl",text:"Indulgent Specialty Shakes · Fruity Pebbles & Kit Kat"}),
      h("div",{class:"sub",style:"color:var(--navy);font-weight:700",text:"Menu Training"}),
      h("p",{style:"margin:14px 0 0;font-size:13px;color:var(--muted)",text:"This certifies that"}),
      h("div",{class:"name",text:name||"Team Member"}),
      h("p",{style:"margin:8px 0 0;font-size:13px;color:var(--muted)",text:"has successfully completed the training with a score of"}),
      h("div",{class:"scorebig",text:S.bestScore+"%"}),
      h("p",{class:"meta",text:"Completed "+dateStr+"  ·  Total points: "+S.points})
    ]);
    card.appendChild(cert);
    if(!name){
      card.appendChild(h("p",{class:"eyebrow",style:"margin-top:16px;text-align:center",text:"Add your name to personalize it"}));
      var input=h("input",{class:"nameinput",type:"text",placeholder:"Your name",maxlength:"40"});
      card.appendChild(input);
      card.appendChild(h("button",{class:"btn btn-primary btn-sm",style:"width:100%;margin-top:10px",onClick:function(){
        S.name=input.value.trim(); draw(S.name);
      }},"Add to Certificate"));
    }
    var actions=h("div",{style:"display:flex;gap:10px;margin-top:14px"});
    actions.appendChild(h("button",{class:"btn btn-gold",style:"flex:1",onClick:function(){window.print();}},"🖨️ Print / Save"));
    card.appendChild(actions);
    // badge wall
    card.appendChild(h("p",{class:"eyebrow",style:"margin-top:22px;text-align:center",text:"Badges Earned"}));
    var tray=h("div",{class:"badgetray"});
    for(var id in BADGES){
      tray.appendChild(h("div",{class:"bdg"+(S.badges[id]?" earned":"")},[
        h("div",{class:"disc"},BADGES[id].ic), h("span",{text:BADGES[id].name})
      ]));
    }
    card.appendChild(tray);
    card.appendChild(h("div",{class:"callout",style:"margin-top:18px"},[h("span",{class:"ic"},"🇺🇸"),
      h("div",{},[h("b",{},"Build → Sprinkle → Serve. "),document.createTextNode("Build every shake to the photo, suggest it to every guest, and remember — a portion of every pour honors our nation's heroes. Go live June 30!")])]));
    var finishBtn=h("button",{class:"btn btn-primary",style:"width:100%;margin-top:16px",onClick:function(){
      WB_SCORM.finish();
      finishBtn.textContent="✓ Progress Saved — you may close this window";
      finishBtn.disabled=true;
    }},"Finish & Save to LMS");
    card.appendChild(finishBtn);
  }
  draw(nm);
  root.appendChild(card);
}

/* ============================================================
   ROUTER
   ============================================================ */
var SECTIONS={1:"Welcome",2:"Meet the Menu",3:"Item Training",4:"Prep & Readiness",5:"Guest & Selling",6:"Final Challenge"};
var unlocked=false, navHidden=false;

function render(){
  var scr=FLOW[S.idx];
  var stage=$("stage"); stage.innerHTML=""; window.scrollTo(0,0);
  unlocked=false; navHidden=false;
  $("secLabel").textContent="Section "+scr.sec+" of 6 · "+(scr.label||SECTIONS[scr.sec]);
  $("bar").style.width=((S.idx)/(FLOW.length-1)*100)+"%";

  var ctx={
    unlock:function(){unlocked=true;refreshNav();},
    lock:function(){unlocked=false;refreshNav();},
    hideNav:function(){navHidden=true;$("navbar").style.display="none";},
    next:go
  };
  scr.build(stage,ctx);
  refreshNav();
}
function refreshNav(){
  if(navHidden){ $("navbar").style.display="none"; return; }
  $("navbar").style.display="flex";
  var nav=$("navbar"); nav.innerHTML="";
  var scr=FLOW[S.idx];
  if(S.idx>0){
    nav.appendChild(h("button",{class:"btn btn-ghost",onClick:function(){go(-1);}},"← Back"));
  }
  var needGate=scr.gate && !unlocked;
  var cont=h("button",{class:"btn btn-primary"+(needGate?"":""),onClick:function(){if(!needGate)go(1);}},
    S.idx===FLOW.length-1?"Finish":"Continue →");
  if(needGate) cont.disabled=true;
  nav.appendChild(cont);
}
function go(dir){
  var ni=S.idx+dir;
  if(ni<0||ni>=FLOW.length) return;
  S.idx=ni; render();
  WB_SCORM.commit();
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener("DOMContentLoaded",function(){
  WB_SCORM.init();
  var bl=$("brandLogo"); if(bl&&IMG.logo) bl.src=IMG.logo;
  render();
});
</script>
